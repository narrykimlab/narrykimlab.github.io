# Builds the site on every push to main and every pull request, and at the turn
# of each month (see `schedule`); only main is deployed to GitHub Pages.
name: Build and deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  # The people page shuffles its members once a month (_plugins/monthly_shuffle.rb,
  # by the month in Korea), so the site is rebuilt at 00:05 KST on the 29th to
  # the 1st: the run that lands on the 1st brings in the new month's order, and
  # the others rebuild what is already there.
  schedule:
    - cron: "5 15 28-31 * *"

# The build only reads (configure-pages looks up the Pages site); writing to
# Pages and the OIDC token are the deploy job's alone, so a pull request's
# build never holds them.
permissions:
  contents: read
  pages: read

# Deployments queue up and are never cancelled midway; a pull request's
# superseded runs are.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to a commit, its release in the comment beside it, so
# a tag moved upstream cannot change what builds and deploys the site;
# Dependabot (.github/dependabot.yml) proposes the next commit with each release.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          # ruby-version is read from .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 1 # Increment this number if you need to re-download cached gems
      - name: Install libvips
        # _plugins/picture.rb makes the WebP copies of the photos with it.
        # The package took a t64 suffix in Ubuntu 24.04; older names as fallback.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvips42t64 \
            || sudo apt-get install -y -qq --no-install-recommends libvips42
      - name: Cache WebP copies
        # Keyed by content digest inside, so a stale restore is still correct;
        # only images added since are encoded.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jekyll-cache/pictures
          key: pictures-${{ hashFiles('images/**', '_plugins/picture.rb') }}
          restore-keys: pictures-
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Check links and images
        # Internal only: external sites fail too often for reasons of their own.
        run: >-
          bundle exec htmlproofer ./_site
          --disable-external
          --no-enforce-https
          --swap-urls '^https\://narrykim\.org:,^https\://narrykimlab\.github\.io:'
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        # Uploads the './_site' directory by default
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  # Only main is deployed. A manual run on another branch builds and checks
  # it (Setup Pages included) and stops there.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
