# Publications, newest first, grouped by `year` on /publications/. Each
# author is `name` as printed; `link` (a team.yml link) for a current or
# former member with a profile, `lab: true` for any other lab member. A
# `lab: true` author's `full_name` says which former member the initials
# are; spelled as in alumni_members.yml, it makes the name a link to their
# entry on /people/ (one that is not there is left unlinked, with a warning
# in the build). `is_first` marks a co-first author (¹; a sole first author
# is not marked), and `is_corresponding` every corresponding author, one or
# several, each shown ✉ (the build warns of a paper with none).
# `vip` is the volume, issue and pages as volume(issue):pages, the last page
# in full ("84(9):1764-1782.e10", "12:6026" for an article number; the
# citations take it apart, and the build checks it); leave it out until the
# paper has them. `url` is where the title links. `topics` names one or
# more of _data/topics.yml; /publications/by-topic/ lists the paper under
# each.
# `research` (one of its topics) puts the paper under that section of the
# Research page, which shows the newest two so marked: a paper of the lab's
# own, not a review or a collaboration it had a small part in.
# `image` is the picture on the right of its card there, a file in
# images/papers/ named for the DOI: the article page's own (its og:image,
# often Fig. 1) or a graphical abstract, at least 480px wide.

